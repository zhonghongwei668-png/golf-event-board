<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="国内女子、青少年、业余高尔夫赛事报名日历，按日期展示报名入口、比赛时间、报名时间和官方信息源。">
    <meta name="theme-color" content="#20252b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="赛事报名日历">
    <title>国内高尔夫赛事报名日历</title>
    <link rel="icon" href="./icon.svg">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="preload" href="./data/events.json" as="fetch" crossorigin="anonymous">
    <link rel="modulepreload" href="./event-logic.js">
    <link rel="stylesheet" href="./styles.css?v=20260710-compact">
    <script src="./app.js" type="module"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="赛事筛选">
        <div class="brand">
          <div class="brand-mark">G</div>
          <div>
            <h1>赛事报名日历</h1>
            <p id="updatedAt">正在读取数据</p>
          </div>
        </div>

        <button id="filterToggle" class="filter-toggle" aria-expanded="false" aria-controls="sidebarControls">筛选</button>
        <div class="sidebar-controls" id="sidebarControls">
          <section class="filter-block">
            <h2>分类</h2>
            <div class="segmented" id="categoryFilters">
              <button class="is-active" data-category="all">全部</button>
              <button data-category="women">女子</button>
              <button data-category="women_development">起点</button>
              <button data-category="amateur">业余</button>
              <button data-category="junior">青少年</button>
            </div>
          </section>

          <section class="filter-block">
            <h2>状态</h2>
            <div class="segmented compact" id="statusFilters">
              <button class="is-active" data-status="all">全部</button>
              <button data-status="future">未来</button>
              <button data-status="open">可报名</button>
              <button data-status="deadline">有截止</button>
            </div>
          </section>

          <button id="refreshButton" class="refresh-button">白天每小时更新</button>
        </div>
      </aside>

      <main class="main-panel">
        <div class="top-search-bar">
          <div class="search-box">
            <label for="searchInput">检索</label>
            <input id="searchInput" type="search" placeholder="赛事、地点、入口">
          </div>
          <nav class="top-source-links" aria-label="官方入口">
            <span>官方入口</span>
            <a href="https://www.clpga.org/MatchList?lang=cn" target="_blank" rel="noreferrer">CLPGA</a>
            <a href="https://www.cgagolf.org.cn/game_spare.html" target="_blank" rel="noreferrer">业余</a>
            <a href="https://www.cgagolf.org.cn/game_young.html" target="_blank" rel="noreferrer">青少年</a>
            <a href="https://www.bwvip.com/default.php?g=m&amp;m=baoming&amp;a=baoming_list" target="_blank" rel="noreferrer">大正报名</a>
            <a href="https://member.cgagolf.org.cn/index" target="_blank" rel="noreferrer">会员</a>
          </nav>
        </div>
        <div class="toolbar">
          <div>
            <p class="eyebrow">2026 国内女子 / 青少年 / 业余</p>
            <h2 id="resultTitle">按比赛日期排序</h2>
          </div>
          <div class="toolbar-actions">
            <select id="monthSelect" aria-label="月份筛选">
              <option value="all">全年</option>
            </select>
            <select id="sortSelect" aria-label="排序">
              <option value="asc">日期从早到晚</option>
              <option value="desc">日期从晚到早</option>
            </select>
            <label class="direct-only-filter">
              <input id="directOnly" type="checkbox">
              <span>有报名入口</span>
            </label>
          </div>
        </div>
        <section class="alerts-panel" id="alertsPanel" aria-label="重点提醒"></section>
        <div id="timeline" class="timeline" aria-live="polite" aria-busy="true">
          <section class="month-group loading-events" aria-hidden="true">
            <div class="month-heading">
              <span class="loading-line loading-heading"></span>
            </div>
            <div class="event-grid">
              <div class="event-card loading-card"><span></span><span></span><span></span></div>
              <div class="event-card loading-card"><span></span><span></span><span></span></div>
              <div class="event-card loading-card"><span></span><span></span><span></span></div>
            </div>
          </section>
        </div>
        <section class="watch-panel" id="watchPanel" aria-label="一手资讯源"></section>
      </main>

      <aside class="detail-panel" id="detailPanel" aria-label="赛事详情">
        <div class="empty-detail" id="emptyDetail">
          <span>选择一张赛事卡片</span>
        </div>
        <div class="detail-content" id="detailContent" hidden>
          <div class="detail-header">
            <div>
              <span class="pill" id="detailCategory"></span>
              <h2 id="detailName"></h2>
            </div>
            <button id="closeDetail" class="detail-back-button" aria-label="返回赛事列表">返回上一页</button>
          </div>
          <dl class="detail-meta" id="detailMeta"></dl>
          <div class="detail-actions" id="detailActions"></div>
          <div class="detail-section app-link-section" id="detailAppLinks" hidden></div>
          <div class="detail-section">
            <h3>报名信息</h3>
            <p id="detailSignup"></p>
          </div>
          <div class="detail-section">
            <h3>资格要求</h3>
            <p id="detailRequirement"></p>
          </div>
          <div class="web-preview" id="sourcePreview">
            <div class="preview-bar">
              <span>官方信息源</span>
              <a id="previewOpen" target="_blank" rel="noreferrer">打开网页</a>
            </div>
            <div class="preview-fallback">
              <strong id="previewDomain">官方网页</strong>
              <p>部分官网、公众号页面和报名平台会禁止网页内嵌预览。请用上方按钮在新窗口打开官方信息源。</p>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </body>
</html>
