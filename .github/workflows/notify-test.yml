name: Test DingTalk notification

on:
  workflow_dispatch:
  push:
    tags:
      - "dingtalk-test-*"

jobs:
  notify-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send test notification
        run: npm run notify -- --test
        env:
          NOTIFY_STRICT: "1"
          NOTIFY_REQUIRE_WEBHOOK: "1"
          NOTIFY_SITE_URL: https://zhonghongwei668-png.github.io/golf-event-board/
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_WEBHOOK_2: ${{ secrets.DINGTALK_WEBHOOK_2 || secrets.DINGTALK_WEBHOOK2 || secrets.DINGTALK_WEBHOOK_SECONDARY }}
          DINGTALK_SECRET_2: ${{ secrets.DINGTALK_SECRET_2 || secrets.DINGTALK_SECRET2 || secrets.DINGTALK_SECRET_SECONDARY }}
          DINGTALK_EXPECTED_TARGETS: "2"
