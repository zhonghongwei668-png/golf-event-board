name: Update golf event data

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 0-14 * * *"
  workflow_dispatch:
    inputs:
      notify_open_digest:
        description: "Send DingTalk digest of all currently open registrations"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test event rules
        run: npm test

      - name: Update event data
        run: npm run update

      - name: Validate event data
        run: npm run validate

      - name: Build static site
        run: npm run build

      - name: Detect event changes
        id: event_changes
        run: |
          if ! git diff --quiet data/events.json dist/data/events.json dist/data/sources.json dist/data/app-links.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify event changes
        if: steps.event_changes.outputs.changed == 'true'
        run: npm run notify -- --base HEAD --head working
        env:
          NOTIFY_STRICT: "1"
          NOTIFY_SITE_URL: https://zhonghongwei668-png.github.io/golf-event-board/
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_WEBHOOK_2: ${{ secrets.DINGTALK_WEBHOOK_2 || secrets.DINGTALK_WEBHOOK2 || secrets.DINGTALK_WEBHOOK_SECONDARY }}
          DINGTALK_SECRET_2: ${{ secrets.DINGTALK_SECRET_2 || secrets.DINGTALK_SECRET2 || secrets.DINGTALK_SECRET_SECONDARY }}
          WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}

      - name: Commit updated data
        if: steps.event_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json dist/data/events.json dist/data/sources.json dist/data/app-links.json
          git commit -m "Update golf event data"
          git push

      - name: Notify open registration digest
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.notify_open_digest == 'true') ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[open-digest]'))
        run: npm run notify -- --open-digest
        env:
          NOTIFY_STRICT: "1"
          NOTIFY_REQUIRE_WEBHOOK: "1"
          NOTIFY_SITE_URL: https://zhonghongwei668-png.github.io/golf-event-board/
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_WEBHOOK_2: ${{ secrets.DINGTALK_WEBHOOK_2 || secrets.DINGTALK_WEBHOOK2 || secrets.DINGTALK_WEBHOOK_SECONDARY }}
          DINGTALK_SECRET_2: ${{ secrets.DINGTALK_SECRET_2 || secrets.DINGTALK_SECRET2 || secrets.DINGTALK_SECRET_SECONDARY }}
          WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}
