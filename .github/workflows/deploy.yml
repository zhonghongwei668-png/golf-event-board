name: Update golf event data

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Offset from the top of the hour to reduce delayed or dropped scheduled runs.
    - cron: "17,47 0-14 * * *"
  workflow_dispatch:
    inputs:
      notify_open_digest:
        description: "Send DingTalk digest of all currently open registrations"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test event rules
        run: npm test

      - name: Update event data
        run: npm run update

      - name: Validate event data
        run: npm run validate

      - name: Build static site
        run: npm run build

      - name: Retry pending DingTalk deliveries
        run: npm run notify -- --retry-pending
        env:
          NOTIFY_REQUIRE_WEBHOOK: "1"
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_WEBHOOK_2: ${{ secrets.DINGTALK_WEBHOOK_2 || secrets.DINGTALK_WEBHOOK2 || secrets.DINGTALK_WEBHOOK_SECONDARY }}
          DINGTALK_SECRET_2: ${{ secrets.DINGTALK_SECRET_2 || secrets.DINGTALK_SECRET2 || secrets.DINGTALK_SECRET_SECONDARY }}
          DINGTALK_EXPECTED_TARGETS: "2"

      - name: Notify source health
        run: npm run notify -- --source-health
        env:
          NOTIFY_SITE_URL: https://zhonghongwei668-png.github.io/golf-event-board/
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_WEBHOOK_2: ${{ secrets.DINGTALK_WEBHOOK_2 || secrets.DINGTALK_WEBHOOK2 || secrets.DINGTALK_WEBHOOK_SECONDARY }}
          DINGTALK_SECRET_2: ${{ secrets.DINGTALK_SECRET_2 || secrets.DINGTALK_SECRET2 || secrets.DINGTALK_SECRET_SECONDARY }}
          DINGTALK_EXPECTED_TARGETS: "2"

      - name: Detect event changes
        id: event_changes
        run: |
          notify_changed=false
          if ! git diff --quiet data/events.json dist/data/events.json dist/data/sources.json dist/data/app-links.json; then
            notify_changed=true
          fi

          notify_base=HEAD
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$EVENT_BEFORE" ] && ! echo "$EVENT_BEFORE" | grep -Eq '^0+$'; then
            notify_base="$EVENT_BEFORE"
            if ! git diff --quiet "$EVENT_BEFORE" HEAD -- data/events.json dist/data/events.json dist/data/sources.json dist/data/app-links.json; then
              notify_changed=true
            fi
          fi

          echo "notify_changed=$notify_changed" >> "$GITHUB_OUTPUT"
          echo "notify_base=$notify_base" >> "$GITHUB_OUTPUT"
        env:
          EVENT_BEFORE: ${{ github.event.before }}

      - name: Notify event changes
        if: steps.event_changes.outputs.notify_changed == 'true'
        run: npm run notify -- --base "${{ steps.event_changes.outputs.notify_base }}" --head working
        env:
          NOTIFY_SITE_URL: https://zhonghongwei668-png.github.io/golf-event-board/
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_WEBHOOK_2: ${{ secrets.DINGTALK_WEBHOOK_2 || secrets.DINGTALK_WEBHOOK2 || secrets.DINGTALK_WEBHOOK_SECONDARY }}
          DINGTALK_SECRET_2: ${{ secrets.DINGTALK_SECRET_2 || secrets.DINGTALK_SECRET2 || secrets.DINGTALK_SECRET_SECONDARY }}
          DINGTALK_EXPECTED_TARGETS: "2"
          WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}

      - name: Notify open registration digest
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.notify_open_digest == 'true') ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[open-digest]'))
        run: npm run notify -- --open-digest
        env:
          NOTIFY_REQUIRE_WEBHOOK: "1"
          NOTIFY_SITE_URL: https://zhonghongwei668-png.github.io/golf-event-board/
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_WEBHOOK_2: ${{ secrets.DINGTALK_WEBHOOK_2 || secrets.DINGTALK_WEBHOOK2 || secrets.DINGTALK_WEBHOOK_SECONDARY }}
          DINGTALK_SECRET_2: ${{ secrets.DINGTALK_SECRET_2 || secrets.DINGTALK_SECRET2 || secrets.DINGTALK_SECRET_SECONDARY }}
          DINGTALK_EXPECTED_TARGETS: "2"
          WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}

      - name: Detect files to persist
        id: persist_changes
        run: |
          changed=false
          if ! git diff --quiet data/events.json data/source-health.json data/notification-state.json dist/data/events.json dist/data/source-health.json dist/data/sources.json dist/data/app-links.json; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit updated data
        if: steps.persist_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/source-health.json data/notification-state.json dist/data/events.json dist/data/source-health.json dist/data/sources.json dist/data/app-links.json
          git commit -m "Update golf event data"
          git push

      - name: Enforce source health
        run: npm run health:check

      - name: Enforce DingTalk delivery
        run: npm run notify:check
